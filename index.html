            get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
        };
        // POST memakai text/plain agar tidak memicu preflight CORS (cara resmi yang aman untuk GAS)
        async function gasPost(body) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 20000);
            try {
                const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl.signal });
                return await res.json();
            } finally { clearTimeout(t); }
        }
        async function gasGet(params) {
            const res = await fetch(GAS_URL + '?' + new URLSearchParams(params));
            return await res.json();
        }
        async function sha256Hex(s) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ===== QR / BARCODE =====
        const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        const loadScript = (src) => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
        // Format isi QR pos: SCOUT:<nomor pos>:<kode akses>
        function QR({ text, size = 180 }) {
            let svg = '';
            try { const q = qrcode(0, 'M'); q.addData(text); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) {}
            return <div className="qrbox bg-white p-1.5 rounded-xl inline-block" style={{ width: size, height: size }} dangerouslySetInnerHTML={{ __html: svg }} />;
        }
        // Pemindai kamera (BarcodeDetector bila ada, jika tidak memakai jsQR)
        function QRScanner({ onResult }) {
            const vref = useRef(null);
            const [on, setOn] = useState(false);
            const [msg, setMsg] = useState('');
            useEffect(() => {
                if (!on) return;
                let stream = null, timer = null, stop = false, det = null;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                (async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                        const v = vref.current; if (!v) return;
                        v.srcObject = stream; await v.play();
                        if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
                        if (!det && !window.jsQR) await loadScript(JSQR_URL);
                        const tick = async () => {
                            if (stop) return;
                            let text = '';
                            try {
                                if (v.readyState >= 2) {
                                    if (det) { const r = await det.detect(v); if (r.length) text = r[0].rawValue; }
                                    else if (window.jsQR) {
                                        const k = Math.min(1, 480 / (v.videoWidth || 480));
                                        canvas.width = Math.round(v.videoWidth * k); canvas.height = Math.round(v.videoHeight * k);
                                        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                                        const im = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                        const q = window.jsQR(im.data, im.width, im.height);
                                        if (q) text = q.data;
                                    }
                                }
                            } catch (e) {}
                            if (text) { stop = true; setOn(false); onResult(text); return; }
                            timer = setTimeout(tick, 200);
                        };
                        tick();
                    } catch (e) { setMsg('Kamera tidak bisa dibuka. Izinkan akses kamera, atau isi kode manual di bawah.'); setOn(false); }
                })();
                return () => { stop = true; clearTimeout(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
            }, [on]);
            return (
                <div className="space-y-2">
                    <div className="w-56 h-56 mx-auto bg-slate-100 dark:bg-slate-950 rounded-2xl border-4 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">
                        {on ? (
                            <>
                                <video ref={vref} playsInline muted className="absolute inset-0 w-full h-full object-cover"></video>
                                <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500 opacity-80 animate-[scan_2s_ease-in-out_infinite] shadow-[0_0_10px_#10b981]"></div>
                            </>
                        ) : (
                            <button onClick={() => { setMsg(''); setOn(true); }} className="flex flex-col items-center gap-2 text-slate-500 hover:text-emerald-500 transition">
                                <i className="fa-solid fa-qrcode text-6xl"></i>
                                <span className="text-[10px] font-bold uppercase tracking-widest">Aktifkan Kamera</span>
                            </button>
                        )}
                        <style>{`@keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }`}</style>
                    </div>
                    {msg && <p className="text-[11px] font-bold text-red-500">{msg}</p>}
                </div>
            );
        }

        // ===== PETA LOKASI NYATA (Leaflet + OpenStreetMap) =====
        function RealMap({ points, unlockedPos, completedPos, onPick, height = 340 }) {
            const el = useRef(null), map = useRef(null), layer = useRef(null), me = useRef(null), watch = useRef(null), lastSig = useRef('');
            const [on, setOn] = useState(false);
            const [err, setErr] = useState('');
            useEffect(() => {
                if (!window.L || !el.current) return;
                const m = L.map(el.current);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
                m.setView([0, 120], 5);
                layer.current = L.layerGroup().addTo(m); map.current = m;
                return () => { if (watch.current != null && navigator.geolocation) navigator.geolocation.clearWatch(watch.current); m.remove(); map.current = null; };
            }, []);
            useEffect(() => {
                const m = map.current; if (!m || !layer.current) return;
                layer.current.clearLayers();
                const pts = points.filter(p => isFinite(p.lat) && isFinite(p.lng)).sort((a, b) => a.id - b.id);
                pts.forEach(p => {
                    const done = completedPos.includes(p.id), open = unlockedPos.includes(p.id);
                    const bg = done ? '#10b981' : open ? '#facc15' : '#94a3b8', fg = done ? '#fff' : '#0f172a';
                    const html = '<div style="width:34px;height:34px;border-radius:50%;background:' + bg + ';color:' + fg + ';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">' + (done && p.id === 7 ? '★' : p.id) + '</div>';
                    const tip = document.createElement('span'); tip.textContent = 'Pos ' + p.id + (p.title ? ': ' + p.title : '');
                    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html, iconSize: [34, 34], iconAnchor: [17, 17] }) })
                        .on('click', () => onPick && onPick(p.id)).bindTooltip(tip).addTo(layer.current);
                });
                if (pts.length > 1) L.polyline(pts.map(p => [p.lat, p.lng]), { color: '#ca8a04', weight: 3, dashArray: '6 8' }).addTo(layer.current);
                const sig = pts.map(p => p.id + ',' + p.lat + ',' + p.lng).join('|');
                if (sig !== lastSig.current && pts.length) {
                    lastSig.current = sig;
                    if (pts.length > 1) m.fitBounds(pts.map(p => [p.lat, p.lng]), { padding: [40, 40], maxZoom: 18 });
                    else m.setView([pts[0].lat, pts[0].lng], 17);
                }
            }, [points, unlockedPos, completedPos]);
            const toggleMe = () => {
                if (on) {
                    navigator.geolocation.clearWatch(watch.current); watch.current = null;
                    if (me.current) { me.current.remove(); me.current = null; }
                    setOn(false); return;
                }
                if (!navigator.geolocation) { setErr('Perangkat tidak mendukung GPS.'); return; }
                setErr(''); setOn(true);
                let first = true;
                watch.current = navigator.geolocation.watchPosition(pos => {
                    const ll = [pos.coords.latitude, pos.coords.longitude];
                    if (!map.current) return;
                    if (!me.current) me.current = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map.current);
                    else me.current.setLatLng(ll);
                    if (first) { first = false; map.current.panTo(ll); }
                }, () => { setErr('Lokasi tidak bisa diakses. Izinkan akses lokasi di browser.'); setOn(false); }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
            };
            return (
                <div>
                    <div className="relative">
                        <div ref={el} style={{ height, position: 'relative', zIndex: 0 }} className="w-full rounded-3xl overflow-hidden border-4 border-slate-300 dark:border-slate-700/80 shadow-2xl"></div>
                        <button onClick={toggleMe} style={{ zIndex: 400 }} className={'absolute bottom-4 left-4 px-3 py-2 rounded-xl text-xs font-bold shadow-lg ' + (on ? 'bg-blue-600 text-white' : 'bg-white text-slate-800')}>
                            <i className="fa-solid fa-location-crosshairs mr-1"></i>{on ? 'Matikan lokasi' : 'Lokasi saya'}
                        </button>
                    </div>
                    {err && <p className="text-[11px] font-bold text-red-500 mt-1">{err}</p>}
                </div>
            );
        }
