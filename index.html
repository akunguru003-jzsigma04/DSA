<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scout Adventure - MAN 1 Boalemo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX Compiler) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tambahan Script (Tema, Download Sertifikat & Efek) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0B1120; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
        }
        .glass-header { 
            background: rgba(2, 6, 23, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(234, 179, 8, 0.2); 
        }
        .pulse-sos { animation: pulse-sos 2s infinite; }
        @keyframes pulse-sos {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .fire-flicker { animation: flicker 3s infinite alternate; }
        @keyframes flicker { 
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.8; transform: scale(1.05); } 
        }
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }
        .map-line { stroke-dasharray: 5; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -100; } }
        
        /* Mode Hemat Baterai (Mematikan Animasi) */
        .battery-saver *, .battery-saver *::before, .battery-saver *::after {
            animation: none !important;
            transition: none !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ============================================================
        // KONFIGURASI: tempel URL Web App Google Apps Script Anda di bawah
        // (hasil Deploy > Web app, berakhiran /exec)
        // ============================================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx0_eJpnbIF2Z_w3votYw9wriPS-xp4Syql_gAOGpr2POPU0Xjeg2FlAsqZhTVRbhgaVg/exec";

        const { useState, useEffect, useRef } = React;

        // Data Pos Default
        const defaultCheckpoints = [
            { id: 1, title: 'Gerbang Penjelajah', desc: 'Berdoa sebelum perjalanan dimulai dan siapkan perlengkapan.', unlockCode: 'POS-1-MULAI', points: 100 },
            { id: 2, title: 'Jejak Pramuka', desc: 'Identifikasi tanda jejak dan pelestarian alam.', unlockCode: 'POS-2-JEJAK', points: 100 },
            { id: 3, title: 'Rahasia Sandi', desc: 'Pecahkan sandi kotak dan rumput.', unlockCode: 'POS-3-SANDI', points: 100 },
            { id: 4, title: 'Navigasi Kiblat', desc: 'Gunakan kompas untuk mencari arah utara dan Kiblat.', unlockCode: 'POS-4-ARAH', points: 100 },
            { id: 5, title: 'Kecakapan & P3K', desc: 'Simulasi P3K dan foto penanganan.', unlockCode: 'POS-5-TOLONG', points: 150 },
            { id: 6, title: 'Misi Dasa Darma', desc: 'Studi kasus interaktif Dasa Darma dalam kehidupan.', unlockCode: 'POS-6-DARMA', points: 100 },
            { id: 7, title: 'Harta Karun', desc: 'Gabungkan semua petunjuk untuk menemukan lokasi akhir.', unlockCode: 'POS-7-AKHIR', points: 200 }
        ];

        // ===== LAYER KONEKSI GOOGLE SHEETS (via Google Apps Script) =====
        // Jika GAS_URL belum diisi, aplikasi berjalan seperti semula (mode lokal / demo).
        const GAS_READY = /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\//.test(GAS_URL);
        const LS = {
            get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
        };
        // POST memakai text/plain agar tidak memicu preflight CORS (cara resmi yang aman untuk GAS)
        async function gasPost(body) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 20000);
            try {
                const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl.signal });
                return await res.json();
            } finally { clearTimeout(t); }
        }
        async function gasGet(params) {
            const res = await fetch(GAS_URL + '?' + new URLSearchParams(params));
            return await res.json();
        }
        async function sha256Hex(s) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Panel tugas di layar misi (jawaban diperiksa di server)
        function TaskPanel({ tasks, gate, max, ans, setAns, onSubmit, busy, info, onRefresh }) {
            const digital = tasks.filter(t => t.jenis !== 'PRAKTIK');
            const praktik = tasks.filter(t => t.jenis === 'PRAKTIK');
            const set = (no, v) => setAns({ ...ans, [no]: v });
            const opt = 'flex items-start gap-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm text-slate-700 dark:text-slate-200 cursor-pointer';
            const inp = 'w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 px-3 py-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500';
            return (
                <div className="text-left space-y-4 mb-6">
                    {digital.map(t => (
                        <div key={t.no} className="space-y-2">
                            <div className="text-sm font-bold text-slate-800 dark:text-slate-100">{t.no}. {t.teks}</div>
                            {t.petunjuk && <div className="text-[11px] text-slate-500 dark:text-slate-400 italic">{t.petunjuk}</div>}
                            {t.jenis === 'PILIHAN' && t.opsi.map((o, i) => (
                                <label key={i} className={opt}><input type="radio" name={'q' + t.no} disabled={gate.l} checked={ans[t.no] === i + 1} onChange={() => set(t.no, i + 1)} className="mt-0.5" /><span>{o}</span></label>
                            ))}
                            {t.jenis === 'CENTANG' && t.opsi.map((o, i) => {
                                const cur = ans[t.no] || [];
                                return (<label key={i} className={opt}><input type="checkbox" disabled={gate.l} checked={cur.includes(i + 1)} onChange={() => set(t.no, cur.includes(i + 1) ? cur.filter(x => x !== i + 1) : [...cur, i + 1])} className="mt-0.5" /><span>{o}</span></label>);
                            })}
                            {(t.jenis === 'ISIAN' || t.jenis === 'ANGKA') && (
                                <input className={inp} disabled={gate.l} value={ans[t.no] || ''} inputMode={t.jenis === 'ANGKA' ? 'decimal' : 'text'} onChange={e => set(t.no, e.target.value)} placeholder={t.jenis === 'ANGKA' ? 'Tulis angka jawaban' : 'Tulis jawaban'} />
                            )}
                        </div>
                    ))}
                    {digital.length > 0 && (
                        <div className="space-y-2">
                            <button disabled={busy || gate.l} onClick={onSubmit} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white font-black rounded-xl transition active:scale-95">
                                {gate.l ? '✔ Tugas digital lulus' : busy ? 'Memeriksa...' : 'KIRIM JAWABAN'}
                            </button>
                            {!gate.l && info && <p className="text-xs font-bold text-red-500 text-center">{info}</p>}
                            {!gate.l && <p className="text-[10px] text-slate-500 text-center">Percobaan: {gate.c}/{max} • butuh internet untuk mengirim jawaban</p>}
                        </div>
                    )}
                    {praktik.map(t => (
                        <div key={t.no} className="p-3 rounded-xl bg-yellow-50 dark:bg-yellow-500/10 border border-yellow-300 dark:border-yellow-500/30 text-sm text-slate-700 dark:text-slate-200">
                            <b className="text-yellow-700 dark:text-yellow-400">Tantangan praktik:</b> {t.teks}
                        </div>
                    ))}
                    {praktik.length > 0 && (
                        <div className="flex items-center justify-between gap-2 text-xs font-bold">
                            <span className={gate.v ? 'text-emerald-600 dark:text-emerald-400' : 'text-yellow-700 dark:text-yellow-400'}>{gate.v ? '✔ Praktik disetujui penjaga pos' : '⏳ Menunggu persetujuan penjaga pos'}</span>
                            {!gate.v && <button onClick={onRefresh} className="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg"><i className="fa-solid fa-rotate mr-1"></i>Cek status</button>}
                        </div>
                    )}
                </div>
            );
        }

        // Dashboard Pembina / Panel Panitia (data langsung dari Google Sheets)
        function AdminPanel({ auth, canAdmin, notify }) {
            const [tab, setTab] = useState('MONITOR');
            const [d, setD] = useState(null);
            const [busy, setBusy] = useState(false);
            const [vf, setVf] = useState({ regu: '', pos: 1, poin: 0, cat: '', tipe: 'BONUS' });
            const [rf, setRf] = useState({ nama: '', ketua: '', anggota: '', pin: '' });
            const [posEdit, setPosEdit] = useState([]);
            const card = 'bg-white/80 dark:bg-slate-900/60 backdrop-blur-md p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-lg';
            const inp = 'w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 px-3 py-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500';
            const btn = 'px-4 py-2.5 rounded-xl text-xs font-black text-white bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition disabled:opacity-50';
            const call = (op, extra) => gasPost({ action: 'admin', op, pin: auth.pin, ...extra });
            const load = async (force) => {
                try {
                    const r = await call('monitor');
                    if (r.ok) { setD(r); setPosEdit(p => (force || p.length === 0) ? r.pos : p); }
                    else notify(r.msg || 'Gagal memuat data.', 'error');
                } catch (e) { /* dicoba lagi pada siklus berikutnya */ }
            };
            useEffect(() => { load(true); const iv = setInterval(() => load(false), 15000); return () => clearInterval(iv); }, []);
            const act = async (op, extra, okMsg) => {
                setBusy(true);
                try {
                    const r = await call(op, extra);
                    if (r.ok) { notify(okMsg, 'success'); await load(true); return true; }
                    notify(r.msg || 'Gagal menyimpan.', 'error');
                } catch (e) { notify('Gagal terhubung ke server.', 'error'); }
                finally { setBusy(false); }
                return false;
            };
            const tabs = [['MONITOR', 'Pemantauan', 'fa-satellite-dish'], ['VALIDASI', 'Validasi Pos', 'fa-clipboard-check'], ['SOS', 'SOS', 'fa-triangle-exclamation']]
                .concat(canAdmin ? [['ATUR', 'Pengaturan', 'fa-sliders']] : []);
            const sosNew = d ? d.sos.filter(s => s.status !== 'DITANGANI').length : 0;
            const reguSel = vf.regu || (d && d.teams[0] ? d.teams[0].name : '');
            const upPos = (id, k, v) => setPosEdit(posEdit.map(x => x.id === id ? { ...x, [k]: v } : x));

            return (
                <div className="space-y-4 animate-fade-in-up">
                    <div className={card + ' flex flex-wrap items-center justify-between gap-3'}>
                        <div>
                            <h2 className="text-xl font-black text-slate-900 dark:text-white"><i className="fa-solid fa-laptop-code text-emerald-500 mr-2"></i>{canAdmin ? 'Panel Panitia' : 'Dashboard Pembina'}</h2>
                            <p className="text-[11px] text-slate-500 dark:text-slate-400">Data langsung dari Google Sheets • refresh otomatis tiap 15 detik</p>
                        </div>
                        {d && (
                            <div className="flex flex-wrap gap-2 text-[11px] font-bold">
                                <span className="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800">{d.teams.length} regu</span>
                                <span className="px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400">{d.teams.filter(t => t.completed.length === 7).length} selesai</span>
                                <span className={'px-2.5 py-1 rounded-lg ' + (sosNew ? 'bg-red-600 text-white pulse-sos' : 'bg-slate-200 dark:bg-slate-800')}>{sosNew} SOS baru</span>
                                <span className="px-2.5 py-1 rounded-lg bg-yellow-100 dark:bg-yellow-500/20 text-yellow-700 dark:text-yellow-400">{d.status}</span>
                            </div>
                        )}
                        <button onClick={() => load(true)} className="px-3 py-2 bg-slate-200 dark:bg-slate-800 rounded-lg text-xs" title="Muat ulang"><i className="fa-solid fa-rotate"></i></button>
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-1">
                        {tabs.map(([k, label, ic]) => (
                            <button key={k} onClick={() => setTab(k)} className={'px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap flex items-center gap-2 transition ' + (tab === k ? 'bg-yellow-500 text-slate-950 shadow-lg' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300')}>
                                <i className={'fa-solid ' + ic}></i>{label}
                            </button>
                        ))}
                    </div>

                    {!d && <div className={card + ' text-center text-sm text-slate-500'}>Memuat data...</div>}

                    {d && tab === 'MONITOR' && (
                        <div className="space-y-3">
                            {d.teams.length === 0 && <div className={card + ' text-center text-sm text-slate-500'}>Belum ada regu terdaftar.</div>}
                            {d.teams.map((t, i) => (
                                <div key={t.name} className={card}>
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-full bg-yellow-400 text-slate-900 font-black flex items-center justify-center text-sm shrink-0">{i + 1}</span>
                                        <div className="flex-1 min-w-0">
                                            <div className="font-bold text-slate-900 dark:text-white truncate">{t.name}</div>
                                            <div className="text-[11px] text-slate-500 dark:text-slate-400 truncate">Ketua: {t.leader || '-'} • Aktif: {t.last || 'belum ada'}{t.finish ? ' • Selesai ' + t.finish : ''}</div>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <div className="font-black text-emerald-600 dark:text-emerald-400">{t.points} PTS</div>
                                            <div className="text-[10px] text-slate-500">{t.completed.length}/7 pos</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-1.5 mt-3">
                                        {[1, 2, 3, 4, 5, 6, 7].map(n => (
                                            <div key={n} className={'flex-1 h-8 rounded-lg flex items-center justify-center text-xs font-bold ' + (t.completed.includes(n) ? 'bg-emerald-500 text-white' : t.unlocked.includes(n) ? 'bg-yellow-400 text-slate-900' : 'bg-slate-200 dark:bg-slate-800 text-slate-400')}>{n}</div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                            <p className="text-[10px] text-slate-500 text-center">Hijau = selesai • Kuning = terbuka • Abu-abu = terkunci</p>
                        </div>
                    )}

                    {d && tab === 'VALIDASI' && (
                        <div className="grid md:grid-cols-2 gap-4">
                            {d.antrian && d.antrian.length > 0 && (
                                <div className={card + ' md:col-span-2 space-y-2 !border-yellow-400'}>
                                    <h3 className="font-black text-slate-900 dark:text-white"><i className="fa-solid fa-hourglass-half text-yellow-500 mr-2"></i>Menunggu persetujuan praktik ({d.antrian.length})</h3>
                                    {d.antrian.map(a => (
                                        <div key={a.regu + a.pos} className="flex flex-wrap items-center justify-between gap-2 text-sm border-b border-slate-200 dark:border-slate-700/60 pb-2">
                                            <div className="min-w-0"><b className="text-slate-800 dark:text-slate-100">{a.regu}</b> <span className="text-xs text-slate-500">• Pos {a.pos}</span><div className="text-[11px] text-slate-500 dark:text-slate-400">{a.teks}</div></div>
                                            <button disabled={busy} className={btn} onClick={() => act('approve', { regu: a.regu, pos: a.pos, tipe: 'VALIDASI', cat: 'Praktik disetujui' }, 'Praktik ' + a.regu + ' disetujui.')}>Setujui</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className={card + ' space-y-3'}>
                                <h3 className="font-black text-slate-900 dark:text-white">Penilaian Penjaga Pos</h3>
                                <select className={inp} value={reguSel} onChange={e => setVf({ ...vf, regu: e.target.value })}>
                                    {d.teams.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                                </select>
                                <select className={inp} value={vf.tipe} onChange={e => setVf({ ...vf, tipe: e.target.value })}>
                                    <option value="BONUS">Poin tambahan / pengurangan</option>
                                    <option value="VALIDASI">Setujui tugas praktik</option>
                                    <option value="LULUS">Loloskan tugas digital (manual)</option>
                                </select>
                                <select className={inp} value={vf.pos} onChange={e => setVf({ ...vf, pos: Number(e.target.value) })}>
                                    {d.pos.map(p => <option key={p.id} value={p.id}>Pos {p.id} - {p.title}</option>)}
                                </select>
                                {vf.tipe === 'BONUS' && <input type="number" className={inp} value={vf.poin} onChange={e => setVf({ ...vf, poin: e.target.value })} placeholder="Poin tambahan / pengurangan (mis. 25 atau -10)" />}
                                <textarea className={inp} rows="2" value={vf.cat} onChange={e => setVf({ ...vf, cat: e.target.value })} placeholder="Catatan (mis. foto P3K sudah benar)"></textarea>
                                <button disabled={busy || !reguSel} className={btn + ' w-full'} onClick={async () => { const ok = vf.tipe === 'BONUS' ? await act('bonus', { regu: reguSel, pos: vf.pos, poin: vf.poin, cat: vf.cat }, 'Penilaian tersimpan.') : await act('approve', { regu: reguSel, pos: vf.pos, tipe: vf.tipe, cat: vf.cat }, 'Persetujuan tersimpan.'); if (ok) setVf({ ...vf, poin: 0, cat: '' }); }}>
                                    <i className="fa-solid fa-floppy-disk mr-2"></i>Simpan Penilaian
                                </button>
                            </div>
                            <div className={card + ' space-y-2'}>
                                <h3 className="font-black text-slate-900 dark:text-white">Kode Akses Pos</h3>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400">Berikan kode ini kepada regu setelah mereka tiba di pos.</p>
                                {d.pos.map(p => (
                                    <div key={p.id} className="flex items-center justify-between gap-2 text-sm border-b border-slate-200 dark:border-slate-700/60 pb-2">
                                        <span className="font-semibold text-slate-700 dark:text-slate-200">Pos {p.id}: {p.title}</span>
                                        <code className="px-2 py-1 rounded-lg bg-yellow-100 dark:bg-yellow-500/10 text-yellow-700 dark:text-yellow-400 font-black text-xs">{p.code}</code>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {d && tab === 'SOS' && (
                        <div className="space-y-3">
                            {d.sos.length === 0 && <div className={card + ' text-center text-sm text-slate-500'}>Belum ada panggilan SOS.</div>}
                            {d.sos.map(s => (
                                <div key={s.id} className={card + ' flex flex-wrap items-center justify-between gap-3 ' + (s.status !== 'DITANGANI' ? '!border-red-400 dark:!border-red-500/60' : '')}>
                                    <div>
                                        <div className="font-black text-slate-900 dark:text-white"><i className="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i>{s.regu} <span className="text-xs font-semibold text-slate-500">• Pos {s.pos || '-'} • {s.t}</span></div>
                                        {s.loc && s.loc.startsWith('https://') && <a href={s.loc} target="_blank" rel="noopener noreferrer" className="text-xs text-blue-600 dark:text-blue-400 underline">Lihat lokasi di peta</a>}
                                    </div>
                                    {s.status !== 'DITANGANI'
                                        ? <button disabled={busy} onClick={() => act('sosDone', { id: s.id }, 'SOS ditandai ditangani.')} className={btn}>Tandai Ditangani</button>
                                        : <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400">✔ Ditangani</span>}
                                </div>
                            ))}
                        </div>
                    )}

                    {d && tab === 'ATUR' && canAdmin && (
                        <div className="space-y-4">
                            <div className={card + ' flex flex-wrap items-center gap-3'}>
                                <h3 className="font-black text-slate-900 dark:text-white">Status Permainan</h3>
                                <select className={inp + ' !w-auto'} value={d.status} onChange={e => act('status', { value: e.target.value }, 'Status permainan diubah.')}>
                                    <option value="BELUM">BELUM DIMULAI</option>
                                    <option value="AKTIF">AKTIF</option>
                                    <option value="SELESAI">SELESAI</option>
                                </select>
                            </div>
                            <div className={card + ' space-y-3'}>
                                <h3 className="font-black text-slate-900 dark:text-white">Parameter Pos</h3>
                                {posEdit.map(p => (
                                    <div key={p.id} className="grid sm:grid-cols-12 gap-2 items-center border-b border-slate-200 dark:border-slate-700/60 pb-3">
                                        <div className="sm:col-span-1 font-black text-yellow-600 dark:text-yellow-400">#{p.id}</div>
                                        <input className={inp + ' sm:col-span-3'} value={p.title} onChange={e => upPos(p.id, 'title', e.target.value)} placeholder="Judul" />
                                        <input className={inp + ' sm:col-span-4'} value={p.desc} onChange={e => upPos(p.id, 'desc', e.target.value)} placeholder="Deskripsi" />
                                        <input className={inp + ' sm:col-span-2 uppercase'} value={p.code} onChange={e => upPos(p.id, 'code', e.target.value)} placeholder="Kode" />
                                        <input type="number" className={inp + ' sm:col-span-1'} value={p.points} onChange={e => upPos(p.id, 'points', e.target.value)} placeholder="Poin" />
                                        <button disabled={busy} className={btn + ' sm:col-span-1'} onClick={() => act('savePos', p, 'Pos ' + p.id + ' tersimpan.')} title="Simpan"><i className="fa-solid fa-floppy-disk"></i></button>
                                    </div>
                                ))}
                            </div>
                            <div className={card + ' space-y-3'}>
                                <h3 className="font-black text-slate-900 dark:text-white">Tambah / Ubah Regu</h3>
                                <div className="grid sm:grid-cols-4 gap-2">
                                    <input className={inp} value={rf.nama} onChange={e => setRf({ ...rf, nama: e.target.value })} placeholder="Nama regu" />
                                    <input className={inp} value={rf.ketua} onChange={e => setRf({ ...rf, ketua: e.target.value })} placeholder="Ketua regu" />
                                    <input className={inp} value={rf.anggota} onChange={e => setRf({ ...rf, anggota: e.target.value })} placeholder="Anggota (opsional)" />
                                    <input className={inp} value={rf.pin} onChange={e => setRf({ ...rf, pin: e.target.value })} placeholder="PIN regu" />
                                </div>
                                <button disabled={busy || !rf.nama.trim()} className={btn} onClick={async () => { if (await act('saveRegu', rf, 'Regu tersimpan.')) setRf({ nama: '', ketua: '', anggota: '', pin: '' }); }}>
                                    <i className="fa-solid fa-user-plus mr-2"></i>Simpan Regu
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Aplikasi Utama React
        function App() {
            // State Utama
            const [role, setRole] = useState('PESERTA');
            const [activeView, setActiveView] = useState('EXPLORE');
            const [showCover, setShowCover] = useState(true);
            const [notification, setNotification] = useState(null);
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            
            // State Persisten (Menyimpan progres di LocalStorage)
            const [teamData, setTeamData] = useState(() => JSON.parse(localStorage.getItem('scout_team')) || { name: 'Regu Elang', leader: 'Ketua Regu' });
            const [points, setPoints] = useState(() => parseInt(localStorage.getItem('scout_points')) || 0);
            const [badges, setBadges] = useState(() => JSON.parse(localStorage.getItem('scout_badges')) || []);
            const [unlockedPos, setUnlockedPos] = useState(() => JSON.parse(localStorage.getItem('scout_unlocked')) || [1]);
            const [completedPos, setCompletedPos] = useState(() => JSON.parse(localStorage.getItem('scout_completed')) || []);
            
            // Interaksi Pos
            const [activePosId, setActivePosId] = useState(null);
            const [scanModalOpen, setScanModalOpen] = useState(false);
            const [inputCode, setInputCode] = useState('');
            const [pendingUnlockPos, setPendingUnlockPos] = useState(null);

            // Tambahan State UI & Pengaturan
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('scout_theme') !== 'light');
            const [isBatterySaver, setIsBatterySaver] = useState(() => localStorage.getItem('scout_battery') === 'true');
            const [showCertificate, setShowCertificate] = useState(false);

            // === State Koneksi Google Sheets ===
            const [checkpoints, setCheckpoints] = useState(() => {
                const c = LS.get('scout_config', null);
                if (!GAS_READY) return defaultCheckpoints;
                return (c && c.pos) ? c.pos : defaultCheckpoints.map(({ unlockCode, ...p }) => p);
            });
            const [cfgMeta, setCfgMeta] = useState(() => LS.get('scout_config', {}) || {});
            const [reguList, setReguList] = useState(() => (LS.get('scout_config', {}) || {}).regu || []);
            const [session, setSession] = useState(() => LS.get('scout_session', null));
            const [gameStatus, setGameStatus] = useState('AKTIF');
            const [syncState, setSyncState] = useState('idle');
            const [pendingCount, setPendingCount] = useState(() => LS.get('scout_outbox', []).length);
            const [loginForm, setLoginForm] = useState({ name: '', leader: '', pin: '' });
            const [loginBusy, setLoginBusy] = useState(false);
            const [adminAuth, setAdminAuth] = useState(() => { try { return JSON.parse(sessionStorage.getItem('scout_admin')); } catch (e) { return null; } });
            const [pinModal, setPinModal] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const sessionRef = useRef(session);
            const syncRef = useRef(null);
            const syncingRef = useRef(false);
            const [gates, setGates] = useState(() => LS.get('scout_gates', {}) || {});
            const [taskAns, setTaskAns] = useState({});
            const [taskBusy, setTaskBusy] = useState(false);
            const [taskInfo, setTaskInfo] = useState(null);

            useEffect(() => {
                sessionRef.current = session;
                LS.set('scout_session', session);
                if (session) { const t = { name: session.name, leader: session.leader || '' }; setTeamData(t); LS.set('scout_team', t); }
            }, [session]);

            useEffect(() => { if (GAS_READY) loadConfig(); }, []);

            // Sinkronisasi berkala (antrean offline + ambil status terbaru dari server)
            useEffect(() => {
                if (!GAS_READY || !session || role !== 'PESERTA') return;
                syncRef.current && syncRef.current();
                let n = 0;
                const iv = setInterval(() => {
                    syncRef.current && syncRef.current();
                    if (++n % 10 === 0) loadConfig();
                }, isBatterySaver ? 60000 : 30000);
                return () => clearInterval(iv);
            }, [session, role, isBatterySaver]);

            // Simpan otomatis ke LocalStorage setiap ada perubahan progres
            useEffect(() => {
                localStorage.setItem('scout_points', points);
                localStorage.setItem('scout_unlocked', JSON.stringify(unlockedPos));
                localStorage.setItem('scout_completed', JSON.stringify(completedPos));
                localStorage.setItem('scout_badges', JSON.stringify(badges));
                localStorage.setItem('scout_theme', isDarkMode ? 'dark' : 'light');
                localStorage.setItem('scout_battery', isBatterySaver);
            }, [points, unlockedPos, completedPos, badges, isDarkMode, isBatterySaver]);

            // Deteksi Koneksi Internet
            useEffect(() => {
                const handleOnline = () => { setIsOffline(false); syncRef.current && syncRef.current(); loadConfig(); };
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => { 
                    window.removeEventListener('online', handleOnline); 
                    window.removeEventListener('offline', handleOffline); 
                };
            }, []);

            // Fungsi Toast Notifikasi
            const notify = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            // Efek Suara Peluit (AudioContext)
            const playWhistle = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.05);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } catch(e) { console.log("Audio API not supported"); }
            };

            // Unduh Sertifikat (Gambar)
            const handleDownloadCertificate = async () => {
                const element = document.getElementById('certificate-card');
                if(!element) return;
                try {
                    const canvas = await html2canvas(element, { scale: 2, backgroundColor: null });
                    const imgData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `Sertifikat-${teamData.name}.png`;
                    link.href = imgData;
                    link.click();
                    notify("Sertifikat berhasil diunduh!", "success");
                } catch (err) {
                    notify("Gagal mengunduh sertifikat.", "error");
                }
            };

            // Fungsi Reset Data
            const handleResetData = () => {
                if(confirm('Yakin ingin mereset seluruh progres game di HP ini?' + (GAS_READY ? ' Progres yang sudah tersimpan di server tidak terhapus dan akan dimuat lagi saat Anda masuk regu.' : '') + (LS.get('scout_outbox', []).length ? ' PERHATIAN: ada data yang belum terkirim ke server dan akan hilang!' : ''))) {
                    localStorage.clear(); setSession(null); setPendingCount(0); setGates({});
                    setPoints(0); setUnlockedPos([1]); setCompletedPos([]); setBadges([]); 
                    notify('Data regu berhasil direset!', 'success');
                }
            };

            // ===== Fungsi Sinkronisasi Google Sheets =====
            const getOutbox = () => LS.get('scout_outbox', []);
            const applyServerState = (st) => {
                if (!st) return;
                setPoints(st.points); setUnlockedPos(st.unlocked); setCompletedPos(st.completed); setBadges(st.badges);
            };
            const loadConfig = async () => {
                try {
                    const r = await gasGet({ action: 'config' });
                    if (r.ok) { setCheckpoints(r.pos); setCfgMeta(r); setReguList(r.regu || []); setGameStatus(r.status || 'AKTIF'); LS.set('scout_config', r); }
                } catch (e) {}
            };
            const syncNow = async () => {
                const s = sessionRef.current;
                if (!GAS_READY || !s || syncingRef.current || !navigator.onLine) return;
                syncingRef.current = true; setSyncState('syncing');
                try {
                    const sent = getOutbox();
                    const r = await gasPost({ action: 'sync', regu: s.name, pin: s.pin, events: sent });
                    if (!r.ok) {
                        if (r.auth === false) { notify(r.msg, 'error'); setSession(null); }
                        throw new Error(r.msg);
                    }
                    const done = new Set(r.results.map(x => x.id));
                    const rest = getOutbox().filter(e => !done.has(e.id));
                    LS.set('scout_outbox', rest); setPendingCount(rest.length);
                    r.results.filter(x => !x.ok).forEach(x => notify(x.msg || 'Data ditolak server.', 'error'));
                    if (rest.length === 0) applyServerState(r.state);
                    if (r.gates) { setGates(r.gates); LS.set('scout_gates', r.gates); }
                    setGameStatus(r.status || 'AKTIF'); setSyncState('ok');
                } catch (e) { setSyncState('error'); }
                finally { syncingRef.current = false; }
            };
            syncRef.current = syncNow;

            const pushEvent = (ev) => {
                const ob = getOutbox();
                ob.push({ id: 'E' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: Date.now(), ...ev });
                LS.set('scout_outbox', ob); setPendingCount(ob.length);
                setTimeout(() => syncRef.current && syncRef.current(), 100);
            };

            const handleLogin = async () => {
                const f = loginForm;
                if (!f.name.trim()) { notify('Isi nama regu terlebih dahulu.', 'error'); return; }
                setLoginBusy(true);
                try {
                    const r = await gasPost({ action: 'login', nama: f.name.trim(), ketua: f.leader.trim(), pin: f.pin.trim() });
                    if (!r.ok) { notify(r.msg || 'Gagal masuk.', 'error'); return; }
                    LS.set('scout_outbox', []); setPendingCount(0);
                    setSession({ name: r.team.name, leader: r.team.leader, pin: f.pin.trim() });
                    applyServerState(r.state); setGates(r.gates || {}); LS.set('scout_gates', r.gates || {}); setGameStatus(r.status || 'AKTIF'); loadConfig();
                    notify('Selamat datang, ' + r.team.name + '!', 'success');
                } catch (e) { notify('Tidak bisa terhubung ke server. Periksa internet Anda.', 'error'); }
                finally { setLoginBusy(false); }
            };

            const handleLogout = () => {
                const n = getOutbox().length;
                if (!confirm('Ganti regu? Data lokal di HP ini dibersihkan (progres tetap tersimpan di server).' + (n ? ' PERHATIAN: ' + n + ' data belum terkirim akan hilang!' : ''))) return;
                LS.set('scout_outbox', []); setPendingCount(0);
                setSession(null); setPoints(0); setUnlockedPos([1]); setCompletedPos([]); setBadges([]); setGates({}); LS.set('scout_gates', {});
            };

            const switchRole = () => {
                const r = ['PESERTA', 'PEMBINA', 'ADMIN'];
                const next = r[(r.indexOf(role) + 1) % r.length];
                if (next === 'PESERTA' || !GAS_READY) { setRole(next); return; }
                if (adminAuth && adminAuth.level >= (next === 'ADMIN' ? 2 : 1)) { setRole(next); return; }
                setPinInput(''); setPinModal(next);
            };

            const submitPin = async () => {
                try {
                    const r = await gasPost({ action: 'admin', op: 'auth', pin: pinInput.trim() });
                    if (!r.ok || r.level < (pinModal === 'ADMIN' ? 2 : 1)) { notify('PIN salah atau tidak memiliki akses.', 'error'); return; }
                    const a = { pin: pinInput.trim(), level: r.level };
                    sessionStorage.setItem('scout_admin', JSON.stringify(a));
                    setAdminAuth(a); setRole(pinModal); setPinModal(null); setPinInput('');
                } catch (e) { notify('Gagal terhubung ke server.', 'error'); }
            };

            const handleSOS = async () => {
                if (!window.confirm('Kirim panggilan SOS darurat ke Pembina?')) return;
                notify("Panggilan SOS Darurat Diaktifkan!", "error");
                if (!GAS_READY || !session) return;
                const posAktif = unlockedPos.filter(i => !completedPos.includes(i))[0] || 7;
                let loc = null;
                try {
                    if (navigator.geolocation) loc = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), rej, { timeout: 4000, maximumAge: 60000 }));
                } catch (e) {}
                pushEvent({ type: 'SOS', pos: posAktif, ...(loc || {}) });
                notify(navigator.onLine ? 'SOS terkirim ke Pembina.' : 'SOS tersimpan & dikirim saat ada sinyal. Segera hubungi Pembina langsung!', navigator.onLine ? 'success' : 'error');
            };

            const taskGateOk = (posId) => {
                if (!GAS_READY) return true;
                const ts = (cfgMeta.tugas || {})[posId] || [];
                if (!ts.length) return true;
                const g = gates[posId] || {};
                const needD = ts.some(t => t.jenis !== 'PRAKTIK'), needP = ts.some(t => t.jenis === 'PRAKTIK');
                return (!needD || !!g.l) && (!needP || !!g.v);
            };

            const submitTask = async (posId) => {
                if (!session) return;
                if (!navigator.onLine) { notify('Mengirim jawaban butuh internet. Cari sinyal lalu coba lagi.', 'error'); return; }
                setTaskBusy(true);
                try {
                    if (syncRef.current) await syncRef.current(); // pastikan pos yang dibuka sudah tercatat di server
                    const r = await gasPost({ action: 'task', regu: session.name, pin: session.pin, pos: posId, answers: taskAns[posId] || {} });
                    if (r.gate) { const ng = { ...gates, [posId]: r.gate }; setGates(ng); LS.set('scout_gates', ng); }
                    if (r.ok) {
                        setTaskInfo({ pos: posId, msg: r.passed ? '' : r.msg });
                        notify(r.msg, r.passed ? 'success' : 'error');
                        if (r.passed) playWhistle();
                    } else { setTaskInfo({ pos: posId, msg: r.msg || '' }); notify(r.msg || 'Gagal mengirim jawaban.', 'error'); }
                } catch (e) { notify('Tidak bisa terhubung ke server. Coba lagi.', 'error'); }
                finally { setTaskBusy(false); }
            };

            const gameClosedMsg = () => gameStatus === 'BELUM' ? 'Permainan belum dimulai oleh panitia.' : 'Permainan sudah ditutup oleh panitia.';

            // Logika Membuka Kunci Pos via Kode Penjaga
            const handleUnlockPos = async () => {
                if (!pendingUnlockPos) return;
                if (GAS_READY && gameStatus !== 'AKTIF') { notify(gameClosedMsg(), 'error'); return; }
                const pos = checkpoints.find(p => p.id === pendingUnlockPos);
                const code = inputCode.trim().toUpperCase();
                let valid = false;
                if (pos.unlockCode) valid = code === pos.unlockCode.toUpperCase();
                else if (pos.hash && window.crypto && crypto.subtle) valid = (await sha256Hex((cfgMeta.salt || '') + ':' + code)) === pos.hash;
                else { notify('Data pos belum termuat. Pastikan internet aktif dan aplikasi dibuka lewat HTTPS.', 'error'); return; }

                if (valid) {
                    if (!unlockedPos.includes(pendingUnlockPos)) {
                        setUnlockedPos([...unlockedPos, pendingUnlockPos]);
                    }
                    setScanModalOpen(false);
                    setInputCode('');
                    setActivePosId(pendingUnlockPos); // Langsung buka misi
                    playWhistle(); // Efek suara
                    notify(`Berhasil membuka Kunci Pos ${pendingUnlockPos}!`, 'success');
                    if (GAS_READY && session) pushEvent({ type: 'BUKA', pos: pendingUnlockPos, code });
                } else {
                    notify('Kode Akses / Barcode tidak valid!', 'error');
                }
            };

            // Logika Menyelesaikan Misi Pos
            const handleCompletePos = (posId, pointsEarned) => {
                if (GAS_READY && gameStatus !== 'AKTIF') { notify(gameClosedMsg(), 'error'); setActivePosId(null); return; }
                if (!completedPos.includes(posId)) {
                    setCompletedPos([...completedPos, posId]);
                    setPoints(prev => prev + pointsEarned);
                    
                    // Tambah lencana khusus (Simulasi)
                    const badgeName = `Lencana Pos ${posId}`;
                    if (!badges.includes(badgeName)) setBadges([...badges, badgeName]);
                    
                    // Efek Harta Karun di Pos 7
                    if (posId === 7) {
                        setTimeout(() => {
                            if(window.confetti) window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 9999 });
                            setShowCertificate(true);
                        }, 500);
                    }

                    // Buka pos berikutnya otomatis (tapi statusnya masih Terkunci Barcode)
                    const nextId = posId + 1;
                    if (nextId <= 7 && !unlockedPos.includes(nextId)) {
                        // Hanya di-unlock aksesnya, tapi tetap butuh scan QR
                        setUnlockedPos([...unlockedPos, nextId]);
                    }
                    notify(`Misi Selesai! Regu Anda mendapat +${pointsEarned} PTS`, 'success');
                    if (GAS_READY && session) pushEvent({ type: 'SELESAI', pos: posId });
                }
                setActivePosId(null);
            };

            return (
                <div className={`${isDarkMode ? 'dark' : ''} ${isBatterySaver ? 'battery-saver' : ''}`}>
                    <div className="min-h-screen bg-slate-50 dark:bg-[#0B1120] dark:bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] dark:from-slate-900 dark:via-[#0B1120] dark:to-black text-slate-800 dark:text-slate-300 font-sans selection:bg-yellow-500 selection:text-slate-900 relative overflow-hidden transition-colors duration-300 pb-20 sm:pb-0">
                        
                        {/* Header Navigasi Glassmorphism */}
                        <header className="glass-header sticky top-0 z-40 shadow-md dark:shadow-xl bg-white/80 dark:bg-slate-950/70 border-b border-slate-200 dark:border-yellow-500/20">
                            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
                                    <i className="fa-solid fa-campground text-slate-900 dark:text-slate-100 text-xl sm:text-2xl"></i>
                                    <div className="text-center sm:text-left">
                                        <h1 className="text-lg sm:text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200 tracking-tight">
                                            DIGITAL SCOUT ADVENTURE
                                        </h1>
                                        <div className="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">
                                            MAN 1 Boalemo Season 4
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex flex-wrap items-center justify-center sm:justify-end gap-2 w-full sm:w-auto">
                                    {/* Pengaturan Tema & Baterai */}
                                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="px-3 py-2 bg-slate-200 dark:bg-slate-800 rounded-lg text-xs font-bold transition" title="Ganti Tema">
                                        {isDarkMode ? <i className="fa-solid fa-sun text-yellow-400"></i> : <i className="fa-solid fa-moon text-slate-600"></i>}
                                    </button>
                                    <button onClick={() => setIsBatterySaver(!isBatterySaver)} className={`px-3 py-2 rounded-lg text-xs font-bold transition ${isBatterySaver ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`} title="Mode Hemat Baterai">
                                        <i className="fa-solid fa-battery-half"></i>
                                    </button>

                                    {/* Peringatan Mode Offline */}
                                {/* Peringatan Mode Offline */}
                                {isOffline && (
                                    <span className="px-2 py-1.5 bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-500/50 rounded-lg text-[10px] font-bold animate-pulse flex items-center gap-1">
                                        <i className="fa-solid fa-wifi-slash"></i> Offline Mode
                                    </span>
                                )}
                                
                                {GAS_READY && role === 'PESERTA' && session && (
                                    <span className={`px-2 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1 border ${syncState === 'error' ? 'bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 border-red-200 dark:border-red-500/40' : pendingCount > 0 ? 'bg-yellow-100 dark:bg-yellow-500/10 text-yellow-700 dark:text-yellow-400 border-yellow-300 dark:border-yellow-500/30' : 'bg-emerald-100 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/30'}`} title="Status sinkronisasi ke Google Sheets">
                                        <i className={`fa-solid ${syncState === 'syncing' ? 'fa-rotate fa-spin' : pendingCount > 0 ? 'fa-cloud-arrow-up' : syncState === 'error' ? 'fa-cloud-bolt' : 'fa-cloud'}`}></i>
                                        {syncState === 'syncing' ? 'Sinkron...' : pendingCount > 0 ? `${pendingCount} antrean` : syncState === 'error' ? 'Gagal sinkron' : 'Tersinkron'}
                                    </span>
                                )}
                                <button onClick={() => setShowCover(true)} className="px-3 py-1.5 bg-yellow-100 dark:bg-yellow-500/10 border border-yellow-300 dark:border-yellow-500/30 text-yellow-700 dark:text-yellow-400 hover:bg-yellow-200 dark:hover:bg-yellow-500/20 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow-sm">
                                    <i className="fa-solid fa-flag"></i> Cover
                                </button>

                                {role === 'PESERTA' && (
                                    <div className="hidden sm:flex items-center gap-2">
                                        <button onClick={() => setActiveView('EXPLORE')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-sm ${activeView === 'EXPLORE' ? 'bg-yellow-500 text-slate-950 shadow-yellow-500/30' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-200 dark:bg-slate-800'}`}>
                                            <i className="fa-solid fa-map-location-dot"></i> Peta
                                        </button>
                                        <button onClick={handleSOS} className="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 pulse-sos shadow-lg shadow-red-600/30">
                                            <i className="fa-solid fa-triangle-exclamation"></i> SOS
                                        </button>
                                    </div>

                                                <h2 className="text-2xl font-bold text-yellow-600 bg-yellow-50 inline-block px-6 py-2 rounded-lg border border-yellow-200">{teamData.name}</h2>
                                            </div>
                                            
                                            <div className="flex justify-center gap-6 pb-2">
                                                <div className="text-center">
                                                    <div className="text-3xl font-black text-emerald-600">{points}</div>
                                                    <div className="text-[10px] font-bold uppercase text-slate-400">Total Poin</div>
                                                </div>
                                                <div className="text-center">
                                                    <div className="text-3xl font-black text-blue-600">{badges.length}</div>
                                                    <div className="text-[10px] font-bold uppercase text-slate-400">Lencana</div>
                                                </div>
                                            </div>
                                            
                                            <p className="text-[10px] text-slate-500 italic max-w-xs mx-auto border-t border-slate-200 pt-4">
                                                Telah berhasil menyelesaikan seluruh misi penjelajahan dengan gemilang.
                                            </p>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-3">
                                        <button onClick={handleDownloadCertificate} className="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-download"></i> Unduh PDF/JPG
                                        </button>
                                        <button onClick={() => setShowCertificate(false)} className="px-6 py-4 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition">
                                            Tutup
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* --- BOTTOM NAVIGATION BAR (MOBILE FIRST) --- */}
                    {role === 'PESERTA' && (
                        <div className="sm:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 flex items-center justify-around py-3 px-2 z-40 pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.1)]">
                            <button onClick={() => setActiveView('EXPLORE')} className={`flex flex-col items-center gap-1.5 p-2 rounded-xl transition ${activeView === 'EXPLORE' ? 'text-yellow-600 dark:text-yellow-400 font-bold' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                                <i className="fa-solid fa-map-location-dot text-xl"></i>
                                <span className="text-[10px] uppercase tracking-wider">Peta Jalur</span>
                            </button>
                            
                            {completedPos.length === 7 && (
                                <button onClick={() => setShowCertificate(true)} className="flex flex-col items-center gap-1.5 p-2 rounded-xl text-emerald-600 dark:text-emerald-400 font-bold animate-bounce">
                                    <i className="fa-solid fa-award text-xl"></i>
                                    <span className="text-[10px] uppercase tracking-wider">Sertifikat</span>
                                </button>
                            )}

                            <button onClick={handleSOS} className="flex flex-col items-center gap-1.5 p-2 rounded-xl text-red-500 hover:text-red-400 font-bold pulse-sos relative -top-3 bg-white dark:bg-slate-900 border-4 border-[#eef2e6] dark:border-[#1a2e1d] w-16 h-16 justify-center shadow-lg">
                                <i className="fa-solid fa-triangle-exclamation text-2xl"></i>
                                <span className="text-[9px] uppercase tracking-wider">SOS</span>
                            </button>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {notification && (
                        <div className={`fixed bottom-24 sm:bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3.5 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-3 z-[60] animate-fade-in-up border ${notification.type === 'success' ? 'bg-emerald-100 dark:bg-emerald-950/90 text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/50' : 'bg-red-100 dark:bg-red-950/90 text-red-700 dark:text-red-400 border-red-300 dark:border-red-500/50'} backdrop-blur-md`}>
                            <i className={`fa-solid ${notification.type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}`}></i>
                            {notification.msg}
                        </div>
                    )}
                </div>
            </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
